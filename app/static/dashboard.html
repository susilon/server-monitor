<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggregator Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --accent-color: #38bdf8;
        --border-color: #334155;
        --secondary-text: #94a3b8;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -1px rgb(0 0 0 / 0.06);
    }

    .card-ip {
        font-size: 0.75rem;
        color: var(--secondary-text);
        margin-top: -4px;
    }

    [data-theme="light"] {
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --text-color: #0f172a;
        --accent-color: #0284c7;
        --border-color: #e2e8f0;
        --secondary-text: #64748b;
        --success: #16a34a;
        --warning: #d97706;
        --danger: #dc2626;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -1px rgb(0 0 0 / 0.06);
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 24px;
        transition: background-color 0.3s, color 0.3s;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 32px;
    }

    h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
    }

    .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
    }

    .btn-group {
        display: flex;
        gap: 8px;
    }

    input, select {
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-color);
        outline: none;
    }

    button {
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-color);
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
    }

    button:hover {
        border-color: var(--accent-color);
        background-color: var(--accent-color);
        color: white;
    }

    #addServerBtn {
        background-color: var(--accent-color);
        color: white;
        border: none;
    }

    .grid-container {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(var(--cards-per-row, 3), minmax(300px, 1fr));
    }

    .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow);
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
    }

    .card h3 {
        margin: 0;
        font-size: 18px;
        color: var(--accent-color);
    }

    .card-body .stat-row {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 0.9rem;
    }

    .card-body .stat-label {
        color: var(--secondary-text);
    }

    .chart-container {
        margin-top: 16px;
        height: 120px;
        width: 100%;
    }
    .chart-legend {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 8px;
        font-size: 0.75rem;
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }

    .detail-link {
        display: block;
        text-align: center;
        padding: 8px;
        background-color: var(--border-color);
        color: var(--text-color);
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        transition: all 0.2s;
    }

    .detail-link:hover {
        background-color: var(--accent-color);
        color: white;
    }

    .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--secondary-text);
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
    }

    .dot.on { background: var(--success); }

    .remove-btn {
        background: transparent;
        border: none;
        color: var(--danger);
        cursor: pointer;
        font-size: 1.2rem;
        padding: 0;
        line-height: 1;
    }

    /* Form Styles */
    #serverForm {
        display: none;
        gap: 8px;
        background: var(--card-bg);
        padding: 12px;
        border: 1px solid var(--accent-color);
        border-radius: 8px;
        flex-wrap: wrap;
    }

    .theme-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--border-color);
        background: var(--card-bg);
        cursor: pointer;
    }

    .theme-svg {
        width: 20px;
        height: 20px;
        stroke: var(--text-color);
        fill: none;
        display: none;
    }

    .theme-svg.active {
        display: block;
    }
</style>
</head>
<body data-theme="dark">
    <header>
        <h1>Aggregator Dashboard</h1>
        <div class="controls">
            <select id="layoutSelector">
                <option value="1">1 card / row</option>
                <option value="2">2 cards / row</option>
                <option value="3" selected>3 cards / row</option>
                <option value="4">4 cards / row</option>
                <option value="5">5 cards / row</option>
                <option value="6">6 cards / row</option>
            </select>
            <button id="themeToggle" class="theme-icon">
                <span id="themeIcon">
                    <svg id="icon-dark" class="theme-svg" viewBox="0 0 32 32" stroke="currentColor" stroke-width="2" fill="none" transform="translate(4 4)"><path d="M3.32031 11.6835C3.32031 16.6541 7.34975 20.6835 12.3203 20.6835C16.1075 20.6835 19.3483 18.3443 20.6768 15.032C19.6402 15.4486 18.5059 15.6834 17.3203 15.6834C12.3497 15.6834 8.32031 11.654 8.32031 6.68342C8.32031 5.50338 8.55165 4.36259 8.96453 3.32996C5.65605 4.66028 3.32031 7.89912 3.32031 11.6835Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <svg id="icon-light" class="theme-svg" viewBox="0 0 32 32" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M16,12a4,4,0,1,1-4,4,4.0045,4.0045,0,0,1,4-4m0-2a6,6,0,1,0,6,6,6,6,0,0,0-6-6Z" transform="translate(0 0.0049)"/><rect x="6.8536" y="5.3745" width="1.9998" height="4.958" transform="translate(-3.253 7.8584) rotate(-45)"/><rect x="2" y="15.0049" width="5" height="2"/><rect x="5.3745" y="23.1466" width="4.958" height="1.9998" transform="translate(-14.7739 12.6305) rotate(-45)"/><rect x="15" y="25.0049" width="2" height="5"/><rect x="23.1466" y="21.6675" width="1.9998" height="4.958" transform="translate(-10.0018 24.1514) rotate(-45)"/><rect x="25" y="15.0049" width="5" height="2"/><rect x="21.6675" y="6.8536" width="4.958" height="1.9998" transform="translate(1.5191 19.3793) rotate(-45)"/><rect x="15" y="2.0049" width="2" height="5"/></svg>
                </span>
            </button>
            <div class="btn-group">
                <button id="addServerBtn">Add Server</button>
                <form id="serverForm">
                    <input type="text" id="srvName" placeholder="Name" required>
                    <input type="text" id="srvIp" placeholder="IP" required>
                    <input type="number" id="srvPort" placeholder="Port" required>
                    <button type="submit">Add</button>
                </form>
            </div>
        </div>
    </header>

    <div id="grid" class="grid-container" style="--cards-per-row: 3;"></div>

    <script>
        const grid = document.getElementById('grid');
        const layoutSelector = document.getElementById('layoutSelector');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const addServerBtn = document.getElementById('addServerBtn');
        const serverForm = document.getElementById('serverForm');

        let servers = JSON.parse(localStorage.getItem('monitored_servers')) || [];
        const charts = {};
        const histories = {};

        // Theme Management
        function updateThemeUI(theme) {
            document.getElementById('icon-dark').classList.toggle('active', theme === 'dark');
            document.getElementById('icon-light').classList.toggle('active', theme === 'light');
        }

        themeToggle.addEventListener('click', () => {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('aggregator_theme', next);
            updateThemeUI(next);
        });

        const savedTheme = localStorage.getItem('aggregator_theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeUI(savedTheme);

        // Layout Management
        layoutSelector.addEventListener('change', (e) => {
            grid.style.setProperty('--cards-per-row', e.target.value);
        });

        // Server Management
        addServerBtn.addEventListener('click', () => {
            serverForm.style.display = serverForm.style.display === 'none' ? 'flex' : 'none';
            addServerBtn.textContent = serverForm.style.display === 'none' ? 'Add Server' : 'Cancel';
        });

        serverForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newSrv = {
                id: Date.now().toString(),
                name: document.getElementById('srvName').value,
                ip: document.getElementById('srvIp').value,
                port: document.getElementById('srvPort').value
            };
            servers.push(newSrv);
            localStorage.setItem('monitored_servers', JSON.stringify(servers));
            serverForm.reset();
            serverForm.style.display = 'none';
            addServerBtn.textContent = 'Add Server';
            renderDashboard();
        });

        function removeServer(id) {
            servers = servers.filter(s => s.id !== id);
            localStorage.setItem('monitored_servers', JSON.stringify(servers));
            renderDashboard();
        }

        async function fetchStats(ip, port) {
            try {
                const response = await fetch(`http://${ip}:${port}/api/stats`);
                return await response.json();
            } catch (e) {
                return null;
            }
        }

        // Initialize default server
        function initDefaults() {
            const currentHost = window.location.hostname;
            const currentPort = window.location.port;
            
            // If no servers or local server not in list
            const hasLocal = servers.some(s => s.ip === currentHost && s.port == currentPort);
            if (servers.length === 0 || !hasLocal) {
                const localSrv = {
                    id: 'local-default',
                    name: 'Local Server',
                    ip: currentHost,
                    port: currentPort
                };
                servers.push(localSrv);
                localStorage.setItem('monitored_servers', JSON.stringify(servers));
            }
        }

        function formatUptime(seconds) {
    const months = Math.floor(seconds / 2592000);
    const days = Math.floor((seconds % 2592000) / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);

    const parts = [];
    if (months > 0) parts.push(`${months} month${months !== 1 ? 's' : ''}`);
    if (days > 0) parts.push(`${days} day${days !== 1 ? 's' : ''}`);
    if (hours > 0) parts.push(`${hours} hour${hours !== 1 ? 's' : ''}`);
    if (minutes > 0) parts.push(`${minutes} minute${minutes !== 1 ? 's' : ''}`);

    return parts.length > 0 ? parts.join(', ') : '0 minutes';
}

        async function renderDashboard() {
            charts = {};
            histories = {};
            initDefaults();
            grid.innerHTML = '';

            for (const srv of servers) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <h3>${srv.name}</h3>
                                <div class="card-ip">${srv.ip}</div>
                                <div class="status-indicator">
                                    <span class="dot" id="dot-${srv.id}"></span>
                                    <span id="status-${srv.id}">Connecting...</span>
                                </div>
                            </div>
                            <button class="remove-btn" onclick="removeServer('${srv.id}')">×</button>
                        </div>
                     <div class="card-body">
                        <div id="stats-${srv.id}">Loading...</div>
                        <div class="chart-container">
                            <canvas id="chart-${srv.id}"></canvas>
                        </div>
                        <div class="chart-legend">
                            <div class="legend-item"><span class="legend-dot" style="background: #ef4444;"></span>CPU</div>
                            <div class="legend-item"><span class="legend-dot" style="background: #3b82f6;"></span>Memory</div>
                            <div class="legend-item"><span class="legend-dot" style="background: #10b981;"></span>GPU</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="http://${srv.ip}:${srv.port}" target="_blank" class="detail-link">Detail View</a>
                    </div>
                `;
                grid.appendChild(card);

                const statsDiv = card.querySelector(`#stats-${srv.id}`);
                const dot = card.querySelector(`#dot-${srv.id}`);
                const statusTxt = card.querySelector(`#status-${srv.id}`);

                const ctx = document.getElementById(`chart-${srv.id}`).getContext('2d');
                histories[srv.id] = [];
                charts[srv.id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array(30).fill(''),
                        datasets: [
                            { label: 'CPU', data: [], borderColor: '#ef4444', tension: 0.4, pointRadius: 0 },
                            { label: 'Memory', data: [], borderColor: '#3b82f6', tension: 0.4, pointRadius: 0 },
                            { label: 'GPU', data: [], borderColor: '#10b981', tension: 0.4, pointRadius: 0 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { min: 0, max: 100, ticks: { display: false }, grid: { display: false } },
                            x: { display: false }
                        }
                    }
                });

                const poll = async () => {
                    const data = await fetchStats(srv.ip, srv.port);
                    if (data && data.ready) {
                        const cpu = data.cpu?.pct || 0;
                        const mem = data.mem?.pct || 0;
                        const gpu = data.gpus?.length || 0;
                        statsDiv.innerHTML = `
                            <div class="stat-row"><span class="stat-label">CPU</span><span>${cpu.toFixed(0)}%</span></div>
                            <div class="stat-row"><span class="stat-label">Memory</span><span>${mem.toFixed(0)}%</span></div>
                            <div class="stat-row"><span class="stat-label">GPUs</span><span>${gpu}</span></div>
                            <div class="stat-row"><span class="stat-label">Uptime</span><span>${formatUptime(data.uptime)}</span></div>
                        `;
                        dot.classList.add('on');
                        statusTxt.textContent = 'Online';

                        const history = histories[srv.id];
                        history.push({ cpu, mem, gpu });
                        if (history.length > 30) history.shift();

                        charts[srv.id].data.datasets[0].data = history.map(h => h.cpu);
                        charts[srv.id].data.datasets[1].data = history.map(h => h.mem);
                        charts[srv.id].data.datasets[2].data = history.map(h => h.gpu);
                        charts[srv.id].update('none');
                    } else {
                        statsDiv.innerHTML = `<div class="stat-row"><span class="stat-label">Error</span><span>Offline</span></div>`;
                        dot.classList.remove('on');
                        statusTxt.textContent = 'Offline';
                    }
                };

                poll();
                setInterval(poll, 2000);
            }
        }

        renderDashboard();
    </script>
</body>
</html>
