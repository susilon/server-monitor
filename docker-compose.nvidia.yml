# Use this file instead of docker-compose.yml on servers with an NVIDIA GPU.
# Needs nvidia-container-toolkit on the host.
services:
  monitor:
    build: .
    container_name: server-monitor
    restart: unless-stopped
    network_mode: host
    pid: host
    cap_add: [SYS_PTRACE]
    environment:
      - PORT=${MONITOR_PORT:-8787}
      - INTERVAL=2
      - HOST_ROOT=/hostfs
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility   # exposes nvidia-smi only
    volumes:
      - /:/hostfs:ro,rslave
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
