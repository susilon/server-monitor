# Default file: works on servers with NO GPU or with an AMD GPU.
# NVIDIA server? Use docker-compose.nvidia.yml instead (not in addition).
services:
  monitor:
    build: .
    container_name: server-monitor
    restart: unless-stopped
    network_mode: host        # host NICs + counters (UI on http://<host>:${MONITOR_PORT:-8787})
    pid: host                 # host-wide process/CPU view
    cap_add: [SYS_PTRACE]     # lets us read the host's /proc/1/mounts for the real disk list
    environment:
      - PORT=${MONITOR_PORT:-8787}
      - INTERVAL=2
      - HOST_ROOT=/hostfs
    volumes:
      - /:/hostfs:ro,rslave   # host filesystems, read-only, submounts included
    # AMD GPUs are read from /sys (amdgpu driver), which the container already sees.
